[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chernpp"
version = "1.0.0"
description = "Chern++ - Chern-Monomial Positivity of Morin Thom Polynomials"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "thom polynomials",
    "morin singularities",
    "chern classes",
    "positivity",
    "equivariant cohomology",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    # HiGHS, via scipy.optimize.linprog, drives the certificate search.
    "scipy>=1.11",
    # Table rendering, text and LaTeX. Pure Python, no dependencies of its own.
    "tabulate>=0.9",
    # XLA-compiled fixed-point expansion of the chamber series.
    "jax>=0.4.30",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "jupyter-client>=8"]
dev = ["black>=24", "pre-commit>=3"]

[project.scripts]
chernpp-experiments = "chernpp.experiments:main"
chernpp-search = "chernpp.search_cli:main"


[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# `multidegree` is the SageMath stage; it is packaged for completeness but is
# imported only when regenerating artifacts, and needs a Sage interpreter.
include = ["chernpp*", "multidegree*"]

[tool.setuptools.package-data]
chernpp = ["data/*.npz"]

[tool.black]
line-length = 110
target-version = ["py311"]
